# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间 单位分钟
    lockTime: 10

logging:
  level:
    springfox.documentation: WARN  #关闭 swagger INFO 日志

knife4j:
  enable: true #是否启用knife4j

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl #日志打印
  global-config:
    db-config:
      column-format: "%s" #数据库字段格式化
      logic-delete-field: is_deleted # 全局逻辑删除字段名
      logic-delete-value: 1 # 逻辑已删除值
      logic-not-delete-value: 0 # 逻辑未删除值
      table-prefix: t_ # 表前缀
      id-type: assign_uuid # 主键策略
  mapper-locations: classpath*:/mapper/*.xml

token:
  token-param:
    access-expire-time: 30 # 令牌有效期（单位：分钟） 默认30
    refresh-expire-time: 1440 # 令牌有效期（单位：分钟） 默认1440
    access-token: Access-Token # 令牌自定义标识
    refresh-token: Refresh-Token # 令牌自定义标识
    secret: abcdefghijklmnopqrstuvwxyz1234567890 # 令牌密钥

